service: inco
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-2'}
  stage: ${opt:stage, 'dev'}
  
  tags:
    Project: Incodefy
    Environment: ${sls:stage}
    ManagedBy: Serverless
    Version: 1.0.0
  
  environment:
    USER_POOL_ID: { Ref: CognitoUserPool }
    USER_POOL_CLIENT_ID: { Ref: CognitoUserPoolClient }
    PARAMETERS_TABLE: ${self:service}-${sls:stage}-parameters
    ACTIVITY_LOGS_TABLE: ${self:service}-${sls:stage}-activity-logs
    PERSONALIZATION_TOPIC_ARN: { Ref: PersonalizationTopic }
    SYSTEM_NOTIFICATIONS_TOPIC_ARN: { Ref: SystemNotificationsTopic }
    PROCESSED_MESSAGES_TABLE: ${self:service}-${sls:stage}-processed-messages
    SERVICE_NAME: ${self:service}
    STAGE: ${sls:stage}
    GROUPS_TABLE: ${self:service}-${sls:stage}-groups
    GROUP_MEMBERS_TABLE: ${self:service}-${sls:stage}-group-members
    GROUP_INVITATIONS_TABLE: ${self:service}-${sls:stage}-group-invitations
    ROLE_MAPPINGS_TABLE: ${self:service}-${sls:stage}-role-mappings
    SPACES_TABLE: ${self:service}-${sls:stage}-spaces
    OCCUPANTS_TABLE: ${self:service}-${sls:stage}-occupants
    ESPECIALIDADES_TABLE: ${self:service}-${sls:stage}-especialidades
    TIPOS_INSTRUMENTOS_TABLE: ${self:service}-${sls:stage}-tipos-instrumentos
    INSTRUMENTOS_TABLE: ${self:service}-${sls:stage}-instrumentos
    APPOINTMENTS_TABLE: ${self:service}-${sls:stage}-appointments
    NOTIFICATIONS_TABLE: ${self:service}-${sls:stage}-notifications
    CONNECTIONS_TABLE: ${self:service}-${sls:stage}-websocket-connections
    WS_ENDPOINT: 
      Fn::Sub: 'https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'
    # CQRS/Event Sourcing
    EVENTS_TABLE: ${self:service}-${sls:stage}-events
    SNAPSHOTS_TABLE: ${self:service}-${sls:stage}-snapshots
    OUTBOX_TABLE: ${self:service}-${sls:stage}-outbox
    OPERATIONS_TABLE: ${self:service}-${sls:stage}-operations
    EVENT_BUS_TOPIC_ARN: { Ref: EventBusTopic }
    # SES Configuration
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'incodefy2025@gmail.com'}
    APP_URL: ${env:APP_URL, 'http://localhost:3000'}
    
  logs:
    httpApi: true
    
  httpApi:
    cors:
      allowedOrigins:
        # IMPORTANTE: Reemplazar con los dominios reales en producción
        - 'http://localhost:3000'
        - 'https://tu-dominio-produccion.com'
      allowedHeaders:
        - Content-Type
        - Authorization
        - x-bootstrap-email
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 3600
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Sub:
            - https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
            - UserPoolId: 
                Ref: CognitoUserPool
        audience:
          - Ref: CognitoUserPoolClient
  
  iamRoleStatements:
    - Effect: Allow
      Action:
        - sns:Publish
      Resource:
        - Ref: PersonalizationTopic
        - Ref: SystemNotificationsTopic
        - Ref: EventBusTopic
    
    # === SES EMAIL PERMISSIONS ===
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: '*'
    
    # === COGNITO USER POOL ACCESS ===
    - Effect: Allow
      Action:
        - cognito-idp:ListUsers
        - cognito-idp:AdminGetUser
      Resource:
        - Fn::GetAtt: [CognitoUserPool, Arn]
    
    # === ACTIVITY LOGS TABLE ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - Fn::GetAtt: [ActivityLogsTable, Arn]
        - Fn::Sub: '${ActivityLogsTable.Arn}/index/*'
    
    # === PARAMETERS TABLE ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - Fn::GetAtt: [ParametersTable, Arn]
    
    # === SQS PERMISSIONS ===
    - Effect: Allow
      Action:
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - sqs:ChangeMessageVisibility
      Resource:
        - Fn::GetAtt: [PersonalizationQueue, Arn]
        - Fn::GetAtt: [SystemNotificationsQueue, Arn]

    # === PROCESSED MESSAGES TABLE - IDEMPOTENCIA ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:UpdateItem
      Resource:
        - Fn::GetAtt: [ProcessedMessagesTable, Arn]
    
    # Grupos
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Query
      Resource:
        - Fn::GetAtt: [GroupsTable, Arn]
        - Fn::GetAtt: [GroupMembersTable, Arn]
        - Fn::GetAtt: [GroupInvitationsTable, Arn]
        - Fn::GetAtt: [RoleMappingsTable, Arn]
    
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-group-members
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-group-members/index/UserGroupsIndex
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-groups
    
    # === EVENTS TABLE PERMISSIONS (CQRS) ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - Fn::GetAtt: [EventsTable, Arn]
        - Fn::Sub: '${EventsTable.Arn}/index/*'
        - Fn::GetAtt: [SnapshotsTable, Arn]
    
    # === OUTBOX TABLE PERMISSIONS ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:UpdateItem
        - dynamodb:TransactWriteItems
      Resource:
        - Fn::GetAtt: [OutboxTable, Arn]
        - Fn::Sub: '${OutboxTable.Arn}/index/*'

    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
        - dynamodb:Query
        - dynamodb:GetItem
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-spaces
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-spaces/index/TypeIndex
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-groups
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-occupants
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-occupants/index/TypeIndex
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-especialidades
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-tipos-instrumentos
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-instrumentos
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-appointments
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-appointments/index/*
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-notifications
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-notifications/index/*
    
    # === WEBSOCKET CONNECTIONS TABLE ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:Query
      Resource:
        - Fn::GetAtt: [WebSocketConnectionsTable, Arn]
        - Fn::Sub: '${WebSocketConnectionsTable.Arn}/index/*'
    
    # === API GATEWAY WEBSOCKET MANAGEMENT ===
    - Effect: Allow
      Action:
        - execute-api:ManageConnections
      Resource:
        - Fn::Sub: 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/*'
    
    # === DYNAMODB STREAMS ===
    - Effect: Allow
      Action:
        - dynamodb:GetRecords
        - dynamodb:GetShardIterator
        - dynamodb:DescribeStream
        - dynamodb:ListStreams
      Resource:
        - Fn::GetAtt: [AppointmentsTable, StreamArn]
        - Fn::GetAtt: [OutboxTable, StreamArn]
    
    # === SQS DLQ ACCESS (for Outbox failures) ===
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:GetQueueAttributes
      Resource:
        - Fn::GetAtt: [OutboxDLQ, Arn]

functions:
  # === HEALTH CHECK ===
  health:
    handler: src/handlers/health.check
    events:
      - httpApi:
          method: GET
          path: /health
    timeout: 10
    description: Health check endpoint for monitoring

  # === AMBASSADOR HEALTH & MONITORING ===
  ambassadorHealth:
    handler: src/handlers/health/ambassadorHealth.getHealth
    events:
      - httpApi:
          method: GET
          path: /health/ambassador
    timeout: 10
    description: Ambassador pattern health check - service status, metrics, insights

  ambassadorMetrics:
    handler: src/handlers/health/ambassadorHealth.getMetrics
    events:
      - httpApi:
          method: GET
          path: /health/ambassador/metrics
    timeout: 10
    description: Ambassador telemetry metrics - latency, errors, costs

  ambassadorInsights:
    handler: src/handlers/health/ambassadorHealth.getInsights
    events:
      - httpApi:
          method: GET
          path: /health/ambassador/insights
    timeout: 10
    description: Ambassador automated insights - alerts and recommendations

  ambassadorServiceHealth:
    handler: src/handlers/health/ambassadorHealth.getServiceHealth
    events:
      - httpApi:
          method: GET
          path: /health/ambassador/service/{service}
    timeout: 10
    description: Individual service health check (SNS, DynamoDB, Cognito, SES)

  ambassadorResetMetrics:
    handler: src/handlers/health/ambassadorHealth.resetMetrics
    events:
      - httpApi:
          method: POST
          path: /health/ambassador/reset
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Reset Ambassador metrics (admin only)

  ambassadorHealthPublisher:
    handler: src/handlers/health/ambassadorHealth.publishHealthMetrics
    events:
      - schedule:
          rate: rate(5 minutes)
          description: Publish Ambassador health metrics to CloudWatch every 5 minutes
    timeout: 30
    description: Periodic health metrics publisher for CloudWatch alarms

  chaosTest:
    handler: src/handlers/chaos.run
    events:
      - httpApi:
          method: GET
          path: /chaos-test
    timeout: 10
    description: Chaos engineering endpoint to simulate failures

  simulateLatency:
    handler: src/handlers/chaos/latencyChaos.simulate
    events:
      - httpApi:
          method: GET
          path: /chaos-latency
    description: Simula una respuesta con retardo aleatorio

  # === FUNCIONES DE AUTENTICACIÓN ===
  login:
    handler: src/handlers/login/login.login
    events:
      - httpApi:
          method: POST
          path: /auth/login
    timeout: 30
    reservedConcurrency: 50  # Bulkhead: limita a 50 ejecuciones concurrentes
    description: User authentication endpoint - CRITICAL with concurrency limit
    # Canary Deployment Configuration
    deploymentSettings:
      type: Canary10Percent5Minutes
      alias: Live
      preTrafficHook: validateLoginRequest
      postTrafficHook: validateLoginResponse
      alarms:
        - LoginErrorsAlarm
        - LoginLatencyAlarm

  refresh:
    handler: src/handlers/login/refresh.refresh
    events:
      - httpApi:
          method: POST
          path: /auth/refresh
    timeout: 30
    reservedConcurrency: 30  # Bulkhead: previene saturación del pool
    description: Token refresh endpoint - CRITICAL with concurrency limit
    deploymentSettings:
      type: Linear10PercentEvery1Minute
      alias: Live
      alarms:
        - RefreshErrorsAlarm

  me:
    handler: src/handlers/login/me.me
    events:
      - httpApi:
          method: GET
          path: /me
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Get current user information

  # === FUNCIONES DE PERMISOS ===
  getMyPermissions:
    handler: src/handlers/permissions/permissions.getMyPermissions
    events:
      - httpApi:
          method: GET
          path: /my-permissions
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Get user permissions

  checkPermission:
    handler: src/handlers/permissions/permissions.checkPermission
    events:
      - httpApi:
          method: POST
          path: /check-permission
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Check specific permission

  assignRole:
    handler: src/handlers/permissions/permissions.assignRole
    events:
      - httpApi:
          method: POST
          path: /admin/assign-role
          authorizer:
            name: cognitoJwt
    timeout: 15
    description: Assign role to user (admin only)
  
  # Bootstrap endpoint sin authorizer para crear el primer admin
  assignRoleBootstrap:
    handler: src/handlers/permissions/permissions.assignRole
    events:
      - httpApi:
          method: POST
          path: /bootstrap/assign-role
    timeout: 15
    description: Bootstrap endpoint to create first admin (no auth required)
    
  removeRole:
    handler: src/handlers/permissions/permissions.removeRole
    events:
      - httpApi:
          method: DELETE
          path: /admin/remove-role
          authorizer:
            name: cognitoJwt

  listAvailablePermissions:
    handler: src/handlers/permissions/permissions.listAvailablePermissions
    events:
      - httpApi:
          method: GET
          path: /admin/available-permissions
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: List all available permissions

  listUsersWithRoles:
    handler: src/handlers/permissions/permissions.listUsersWithRoles
    events:
      - httpApi:
          method: GET
          path: /admin/users-with-roles
          authorizer:
            name: cognitoJwt

  # === FUNCIONES DE PERSONALIZACIÓN ===
  getPersonalization:
    handler: src/handlers/personalization/personalization.getPersonalization
    events:
      - httpApi:
          method: GET
          path: /personalization
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Get user personalization settings

  setPersonalization:
    handler: src/handlers/personalization/personalization.setPersonalization
    events:
      - httpApi:
          method: POST
          path: /personalization
          authorizer:
            name: cognitoJwt
  
  # === FUNCIONES DE COMUNICACIÓN DESACOPLADA ===
  handlePersonalizationEvents:
    handler: src/handlers/events.handlePersonalizationEvents
    events:
      - sqs:
          arn:
            Fn::GetAtt: [PersonalizationQueue, Arn]
          batchSize: 5
          maximumBatchingWindow: 10
    reservedConcurrency: 10  # Bulkhead: limita procesamiento SQS concurrente

  handleSystemNotifications:
    handler: src/handlers/events.handleSystemNotifications
    events:
      - sqs:
          arn:
            Fn::GetAtt: [SystemNotificationsQueue, Arn]
          batchSize: 5
          maximumBatchingWindow: 10
    reservedConcurrency: 10  # Bulkhead: aísla procesamiento de notificaciones

  # === CQRS/EVENT SOURCING FUNCTIONS ===
  eventProjection:
    handler: src/handlers/events/eventProjection.handler
    events:
      - sns:
          arn: { Ref: EventBusTopic }
          topicName: ${self:service}-${sls:stage}-event-bus
    reservedConcurrency: 15
    timeout: 30
    description: "Proyecta eventos del Event Store a los Read Models"

  autoSnapshot:
    handler: src/handlers/events/autoSnapshot.handler
    events:
      - schedule:
          rate: rate(6 hours)
          description: "Create snapshots for aggregates with >100 events"
          enabled: true
    reservedConcurrency: 5
    timeout: 300
    description: "Automated snapshot creation for Event Sourcing optimization"

  createAppointmentCQRS:
    handler: src/handlers/appointments/createAppointmentCQRS.handler
    events:
      - httpApi:
          method: POST
          path: /cqrs/appointments/{grupo_id}
          authorizer:
            name: cognitoJwt
    reservedConcurrency: 25
    description: "Crear appointment usando CQRS/Event Sourcing"

  # === OPERATIONS (Async Request-Reply Pattern) ===
  getOperationStatus:
    handler: src/handlers/operations/getOperationStatus.handler
    events:
      - httpApi:
          method: GET
          path: /operations/{operationId}
          authorizer:
            name: cognitoJwt
    description: "Get status of async operation (polling endpoint)"

  # === FUNCIONES DE LOGS ===
  getActivityLogs:
    handler: src/handlers/logs.getActivityLogs
    events:
      - httpApi:
          method: GET
          path: /admin/activity-logs
          authorizer:
            name: cognitoJwt

  getActivityStats:
    handler: src/handlers/logs.getActivityStats
    events:
      - httpApi:
          method: GET
          path: /admin/activity-stats
          authorizer:
            name: cognitoJwt

  # === FUNCIONES DE CONFIGURACIÓN DE ESPACIOS ===
  obtenerConfiguracionEspacios:
    handler: src/handlers/espacios/configuracion.obtenerConfiguracion
    events:
      - httpApi:
          method: GET
          path: /api/espacios/configuracion
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Obtiene la configuración de nomenclatura de espacios

  listarEspacios:
    handler: src/handlers/espacios/configuracion.listarEspacios
    events:
      - httpApi:
          method: GET
          path: /api/espacios/lista
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Lista todos los espacios de un grupo

  asignarGrupoActivo:
    handler: src/handlers/espacios/configuracion.asignarGrupoActivo
    events:
      - httpApi:
          method: PUT
          path: /api/espacios/asignar-grupo
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Asigna un grupo de espacios como activo

  obtenerGrupoActivo:
    handler: src/handlers/espacios/configuracion.obtenerGrupoActivo
    events:
      - httpApi:
          method: GET
          path: /api/espacios/grupo-activo
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Obtiene el grupo de espacios activo del usuario

  eliminarConfiguracionEspacios:
    handler: src/handlers/espacios/configuracion.eliminarConfiguracion
    events:
      - httpApi:
          method: DELETE
          path: /api/espacios/configuracion
          authorizer:
            name: cognitoJwt
    timeout: 30
    description: Elimina una configuración completa de espacios
  
  # === ESPACIOS (reemplazo de pasillos/boxes) ===
  obtenerEspaciosGenerales:
    handler: src/handlers/db/obtenerEspaciosGenerales.handler
    description: Obtiene espacios generales (SPACE) de un grupo

  obtenerEspaciosEspecificos:
    handler: src/handlers/db/obtenerEspaciosEspecificos.handler
    description: Obtiene espacios específicos (SUBSPACE) de un grupo
  
  # === OCUPANTES (reemplazo de médicos) ===
  obtenerOcupantes:
    handler: src/handlers/db/obtenerOcupantes.handler
    description: Obtiene ocupantes (OCCUPANT) de un grupo

  # === Funciones de Grupos ===
  createGroup:
    handler: src/handlers/groups/createGroup.handler
    description: Crea un nuevo grupo
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /groups
          authorizer: cognitoJwt

  updateNomenclatura:
    handler: src/handlers/groups/updateNomenclatura.handler
    description: Actualiza la nomenclatura de un grupo
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /grupos/{groupId}/nomenclatura
          authorizer: cognitoJwt

  listUserGroups:
    handler: src/handlers/groups/listUserGroups.handler
    description: Lista los grupos donde pertenece el usuario
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups
          authorizer: cognitoJwt
  
  saveSpaces:
    handler: src/handlers/groups/saveSpaces.handler
    events:
      - httpApi:
          path: /groups/{groupId}/spaces
          method: POST
          authorizer: cognitoJwt
          
  getGroup:
    handler: src/handlers/groups/getGroup.handler
    events:
      - httpApi:
          method: GET
          path: /grupos/{group_id}
          authorizer: cognitoJwt



  inviteToGroup:
    handler: src/handlers/groups/inviteToGroup.handler
    description: Envía invitación a un usuario
    timeout: 15
    reservedConcurrency: 20  # Bulkhead: previene saturación de SES
    events:
      - httpApi:
          method: POST
          path: /groups/{group_id}/invite
          authorizer: cognitoJwt

  listMembers:
    handler: src/handlers/groups/listMembers.handler
    description: Lista miembros del grupo
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups/{group_id}/members
          authorizer: cognitoJwt

  assignRoleToMember:
    handler: src/handlers/groups/assignRole.handler
    timeout: 10
    description: Cambia rol de un usuario dentro de un grupo
    events:
      - httpApi:
          method: PUT
          path: /groups/{group_id}/members/{user_sub}/role
          authorizer: cognitoJwt

  removeMember:
    handler: src/handlers/groups/removeMember.handler
    timeout: 10
    description: Elimina un usuario del grupo
    events:
      - httpApi:
          method: DELETE
          path: /groups/{group_id}/members/{user_sub}
          authorizer: cognitoJwt

  # === NOTIFICACIONES ===
  listNotifications:
    handler: src/handlers/notifications/listNotifications.handler
    timeout: 10
    description: Lista las notificaciones del usuario
    events:
      - httpApi:
          method: GET
          path: /notifications
          authorizer: cognitoJwt

  markNotificationAsRead:
    handler: src/handlers/notifications/markAsRead.handler
    timeout: 10
    description: Marca una notificación como leída
    events:
      - httpApi:
          method: PUT
          path: /notifications/{id}/read
          authorizer: cognitoJwt
      - httpApi:
          method: PUT
          path: /notifications/read-all
          authorizer: cognitoJwt

  # === GESTIÓN DE ESPACIOS ===
  createSpace:
    handler: src/handlers/groups/createSpace.handler
    description: Crea un nuevo espacio (general o específico)
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /api/espacios/espacio
          authorizer: cognitoJwt

  updateSpace:
    handler: src/handlers/groups/updateSpace.handler
    description: Actualiza un espacio existente
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /api/espacios/espacio/{id}
          authorizer: cognitoJwt

  deleteSpace:
    handler: src/handlers/groups/deleteSpace.handler
    description: Elimina un espacio
    timeout: 10
    events:
      - httpApi:
          method: DELETE
          path: /api/espacios/espacio/{id}
          authorizer: cognitoJwt

  # === GESTIÓN DE ESPECIALIDADES ===
  listEspecialidades:
    handler: src/handlers/especialidades/listEspecialidades.handler
    description: Lista especialidades del grupo
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups/{grupo_id}/especialidades
          authorizer: cognitoJwt

  createEspecialidad:
    handler: src/handlers/especialidades/createEspecialidad.handler
    description: Crea una nueva especialidad
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /groups/{grupo_id}/especialidades
          authorizer: cognitoJwt

  updateEspecialidad:
    handler: src/handlers/especialidades/updateEspecialidad.handler
    description: Actualiza una especialidad
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /groups/{grupo_id}/especialidades/{id}
          authorizer: cognitoJwt

  deleteEspecialidad:
    handler: src/handlers/especialidades/deleteEspecialidad.handler
    description: Elimina una especialidad
    timeout: 10
    events:
      - httpApi:
          method: DELETE
          path: /groups/{grupo_id}/especialidades/{id}
          authorizer: cognitoJwt

  # === GESTIÓN DE OCUPANTES ===
  listOcupantes:
    handler: src/handlers/ocupantes/listOcupantes.handler
    description: Lista ocupantes del grupo
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups/{grupo_id}/ocupantes
          authorizer: cognitoJwt

  createOcupante:
    handler: src/handlers/ocupantes/createOcupante.handler
    description: Crea un nuevo ocupante
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /groups/{grupo_id}/ocupantes
          authorizer: cognitoJwt

  updateOcupante:
    handler: src/handlers/ocupantes/updateOcupante.handler
    description: Actualiza un ocupante
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /groups/{grupo_id}/ocupantes/{id}
          authorizer: cognitoJwt

  deleteOcupante:
    handler: src/handlers/ocupantes/deleteOcupante.handler
    description: Elimina un ocupante
    timeout: 10
    events:
      - httpApi:
          method: DELETE
          path: /groups/{grupo_id}/ocupantes/{id}
          authorizer: cognitoJwt

  # === GESTIÓN DE TIPOS DE INSTRUMENTOS ===
  listTiposInstrumentos:
    handler: src/handlers/tipos-instrumentos/listTiposInstrumentos.handler
    description: Lista tipos de instrumentos del grupo
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups/{grupo_id}/tipos-instrumentos
          authorizer: cognitoJwt

  createTipoInstrumento:
    handler: src/handlers/tipos-instrumentos/createTipoInstrumento.handler
    description: Crea un nuevo tipo de instrumento
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /groups/{grupo_id}/tipos-instrumentos
          authorizer: cognitoJwt

  updateTipoInstrumento:
    handler: src/handlers/tipos-instrumentos/updateTipoInstrumento.handler
    description: Actualiza un tipo de instrumento
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /groups/{grupo_id}/tipos-instrumentos/{id}
          authorizer: cognitoJwt

  deleteTipoInstrumento:
    handler: src/handlers/tipos-instrumentos/deleteTipoInstrumento.handler
    description: Elimina un tipo de instrumento
    timeout: 10
    events:
      - httpApi:
          method: DELETE
          path: /groups/{grupo_id}/tipos-instrumentos/{id}
          authorizer: cognitoJwt

  # === GESTIÓN DE INSTRUMENTOS ===
  listInstrumentos:
    handler: src/handlers/instrumentos/listInstrumentos.handler
    description: Lista instrumentos del grupo
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups/{grupo_id}/instrumentos
          authorizer: cognitoJwt

  createInstrumento:
    handler: src/handlers/instrumentos/createInstrumento.handler
    description: Crea un nuevo instrumento
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /groups/{grupo_id}/instrumentos
          authorizer: cognitoJwt

  updateInstrumento:
    handler: src/handlers/instrumentos/updateInstrumento.handler
    description: Actualiza un instrumento
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /groups/{grupo_id}/instrumentos/{id}
          authorizer: cognitoJwt

  deleteInstrumento:
    handler: src/handlers/instrumentos/deleteInstrumento.handler
    description: Elimina un instrumento
    timeout: 10
    events:
      - httpApi:
          method: DELETE
          path: /groups/{grupo_id}/instrumentos/{id}
          authorizer: cognitoJwt

  # === GESTIÓN DE APPOINTMENTS (AGENDAS) ===
  listAppointments:
    handler: src/handlers/appointments/listAppointments.handler
    description: Lista appointments del grupo por fecha o espacio
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups/{grupo_id}/appointments
          authorizer: cognitoJwt

  createAppointment:
    handler: src/handlers/appointments/createAppointment.handler
    description: Crea un nuevo appointment
    timeout: 10
    reservedConcurrency: 25  # Bulkhead: operación crítica de negocio
    events:
      - httpApi:
          method: POST
          path: /groups/{grupo_id}/appointments
          authorizer: cognitoJwt

  updateAppointment:
    handler: src/handlers/appointments/updateAppointment.handler
    description: Actualiza un appointment
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /groups/{grupo_id}/appointments/{id}
          authorizer: cognitoJwt

  deleteAppointment:
    handler: src/handlers/appointments/deleteAppointment.handler
    description: Elimina un appointment
    timeout: 10
    events:
      - httpApi:
          method: DELETE
          path: /groups/{grupo_id}/appointments/{id}
          authorizer: cognitoJwt

  checkAppointmentConflict:
    handler: src/handlers/appointments/checkConflict.handler
    description: Verifica conflictos de horario para espacio u ocupante
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /groups/{grupo_id}/appointments/check-conflict
          authorizer: cognitoJwt
  
  # === WEBSOCKET HANDLERS ===
  wsConnect:
    handler: src/handlers/websocket/connect.handler
    description: Maneja conexiones WebSocket
    timeout: 10
    reservedConcurrency: 100  # Bulkhead: alto tráfico de conexiones
    events:
      - websocket:
          route: $connect
  
  wsDisconnect:
    handler: src/handlers/websocket/disconnect.handler
    description: Maneja desconexiones WebSocket
    timeout: 10
    reservedConcurrency: 100  # Bulkhead: alto tráfico de desconexiones
    events:
      - websocket:
          route: $disconnect
  
  wsStreamProcessor:
    handler: src/handlers/websocket/streamProcessor.handler
    description: Procesa DynamoDB Stream y notifica cambios vía WebSocket
    timeout: 30
    reservedConcurrency: 20  # Bulkhead: previene sobrecarga en streams
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [AppointmentsTable, StreamArn]
          batchSize: 10
          startingPosition: LATEST
          enabled: true

  wsSpacesStreamProcessor:
    handler: src/handlers/websocket/spacesStreamProcessor.handler
    description: Procesa cambios en Spaces y notifica vía WebSocket
    timeout: 30
    reservedConcurrency: 15  # Bulkhead: aísla procesamiento de espacios
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [SpacesTable, StreamArn]
          batchSize: 10
          startingPosition: LATEST
          enabled: true

  wsOccupantsStreamProcessor:
    handler: src/handlers/websocket/occupantsStreamProcessor.handler
    description: Procesa cambios en Occupants y notifica vía WebSocket
    timeout: 30
    reservedConcurrency: 15  # Bulkhead: aísla procesamiento de ocupantes
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [OccupantsTable, StreamArn]
          batchSize: 10
          startingPosition: LATEST
          enabled: true

  wsGroupMembersStreamProcessor:
    handler: src/handlers/websocket/groupMembersStreamProcessor.handler
    description: Procesa cambios en GroupMembers y notifica vía WebSocket
    timeout: 30
    reservedConcurrency: 15  # Bulkhead: aísla procesamiento de miembros
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [GroupMembersTable, StreamArn]
          batchSize: 10
          startingPosition: LATEST
          enabled: true

  # === OPERATIONS WEBSOCKET HANDLERS (Async Request-Reply Pattern - Phase 2) ===
  wsSubscribeOperation:
    handler: src/handlers/websocket/subscribeOperation.handler
    description: Permite a clientes WebSocket suscribirse a notificaciones de operaciones asíncronas
    timeout: 10
    reservedConcurrency: 50  # Bulkhead: alto tráfico de suscripciones
    events:
      - websocket:
          route: subscribeOperation

  wsOperationsStreamProcessor:
    handler: src/handlers/websocket/operationsStreamProcessor.handler
    description: Procesa cambios en OperationsTable y notifica a clientes WebSocket suscritos (Async Request-Reply)
    timeout: 30
    reservedConcurrency: 20  # Bulkhead: aísla procesamiento de operaciones
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [OperationsTable, StreamArn]
          batchSize: 10
          startingPosition: LATEST
          enabled: true

  # === OUTBOX PROCESSOR (Transactional Outbox Pattern) ===
  outboxProcessor:
    handler: src/handlers/outbox/outboxProcessor.processOutboxStream
    description: Procesa eventos del Outbox y los publica a SNS (Transactional Outbox Pattern)
    timeout: 60
    reservedConcurrency: 10  # Bulkhead: limita concurrencia del relay
    events:
      - stream:
          type: dynamodb
          arn:
            Fn::GetAtt: [OutboxTable, StreamArn]
          batchSize: 25
          startingPosition: LATEST
          enabled: true
          maximumRetryAttempts: 3
          bisectBatchOnFunctionError: true
          maximumRecordAgeInSeconds: 3600
          destinations:
            onFailure:
              type: sqs
              arn:
                Fn::GetAtt: [OutboxDLQ, Arn]

  # Fallback polling processor (backup para testing o degradación)
  outboxPollingProcessor:
    handler: src/handlers/outbox/outboxProcessor.processOutboxPolling
    description: Polling fallback para procesar mensajes PENDING del Outbox
    timeout: 60
    reservedConcurrency: 2
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: false  # Disabled by default, enable if DynamoDB Streams fail

  # === GESTIÓN DE MIEMBROS (rutas alternativas) ===
  listGroupMembers:
    handler: src/handlers/groups/listMembers.handler
    description: Lista miembros del grupo (ruta alternativa)
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /api/grupos/{id}/miembros
          authorizer: cognitoJwt

  inviteGroupMember:
    handler: src/handlers/groups/inviteMember.handler
    description: Envía invitación a un miembro (ruta alternativa)
    timeout: 15
    events:
      - httpApi:
          method: POST
          path: /api/grupos/invitar
          authorizer: cognitoJwt

  updateGroupMemberRole:
    handler: src/handlers/groups/updateMemberRole.handler
    description: Cambia el rol de un miembro (ruta alternativa)
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /api/grupos/miembro/{id}/rol
          authorizer: cognitoJwt

  removeGroupMember:
    handler: src/handlers/groups/removeMember.handler
    description: Remueve un miembro del grupo (ruta alternativa)
    timeout: 10
    events:
      - httpApi:
          method: DELETE
          path: /api/grupos/miembro/{id}
          authorizer: cognitoJwt

  verifyInvitation:
    handler: src/handlers/groups/verifyInvitation.handler
    description: Verifica una invitación por token (público, sin auth)
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /api/invitaciones/verificar

  acceptInvitation:
    handler: src/handlers/groups/acceptInvitation.handler
    description: Acepta una invitación a grupo
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /api/invitaciones/aceptar
          authorizer: cognitoJwt

# Plugins para Blue/Green y Canary Deployments
plugins:
  - serverless-plugin-canary-deployments

package:
  individually: false
  patterns:
    - '!**/*.md'
    - '!**/*.test.*'
    - '!.git/**'
    - '!.github/**'
    - '!coverage/**'
    - '!.vscode/**'

resources:
  Resources:
    # === DYNAMODB ===
    ParametersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-parameters
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_sub
            AttributeType: S
          - AttributeName: parameter_key
            AttributeType: S
        KeySchema:
          - AttributeName: user_sub
            KeyType: HASH
          - AttributeName: parameter_key
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy

    ActivityLogsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-activity-logs
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: user_sub
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserActivityIndex
            KeySchema:
              - AttributeName: user_sub
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    
    # === TABLA DE IDEMPOTENCIA ===
    ProcessedMessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-processed-messages
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: message_id
            AttributeType: S
        KeySchema:
          - AttributeName: message_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # === Tablas grupos ===
    GroupsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-groups
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: group_id
            AttributeType: S
        KeySchema:
          - AttributeName: group_id
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    GroupMembersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-group-members
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: group_id
            AttributeType: S
          - AttributeName: user_sub
            AttributeType: S
        KeySchema:
          - AttributeName: group_id
            KeyType: HASH
          - AttributeName: user_sub
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        GlobalSecondaryIndexes:
          - IndexName: UserGroupsIndex
            KeySchema:
              - AttributeName: user_sub
                KeyType: HASH
            Projection: { ProjectionType: ALL }
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    GroupInvitationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-group-invitations
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: token
            AttributeType: S
        KeySchema:
          - AttributeName: token
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    RoleMappingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-role-mappings
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: role
            AttributeType: S
        KeySchema:
          - AttributeName: role
            KeyType: HASH

    SpacesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-spaces
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        GlobalSecondaryIndexes:
          - IndexName: TypeIndex
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    OccupantsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-occupants
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        GlobalSecondaryIndexes:
          - IndexName: TypeIndex
            KeySchema:
              - AttributeName: PK
                KeyType: HASH
              - AttributeName: SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    EspecialidadesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-especialidades
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    TiposInstrumentosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-tipos-instrumentos
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    InstrumentosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-instrumentos
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    AppointmentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-appointments
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
          - AttributeName: GSI3PK
            AttributeType: S
          - AttributeName: GSI3SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: OcupanteIndex
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: EspacioIndex
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: DateIndex
            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH
              - AttributeName: GSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy

    NotificationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-notifications
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: notification_id
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GroupIndex
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: NotificationIdIndex
            KeySchema:
              - AttributeName: notification_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy
    
    # === WEBSOCKET CONNECTIONS TABLE ===
    WebSocketConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-websocket-connections
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
          - AttributeName: grupo_id
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: GrupoIndex
            KeySchema:
              - AttributeName: grupo_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy

    # === SQS PARA PERSONALIZACIÓN ===
    PersonalizationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-personalization-dlq
        MessageRetentionPeriod: 1209600 # 14 días

    PersonalizationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-personalization-queue
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: 
            Fn::GetAtt: [PersonalizationDLQ, Arn]
          maxReceiveCount: 3

    # Permitir que SNS publique en la cola
    PersonalizationQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - Ref: PersonalizationQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: sqs:SendMessage
              Resource: 
                Fn::GetAtt: [PersonalizationQueue, Arn]
              Condition:
                ArnEquals:
                  aws:SourceArn: 
                    Ref: PersonalizationTopic

    # Suscripción SNS -> SQS
    PersonalizationSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        TopicArn: 
          Ref: PersonalizationTopic
        Endpoint: 
          Fn::GetAtt: [PersonalizationQueue, Arn]

    # === SQS PARA NOTIFICACIONES DEL SISTEMA ===
    SystemNotificationsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-system-notifications-dlq
        MessageRetentionPeriod: 1209600

    SystemNotificationsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-system-notifications-queue
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: 
            Fn::GetAtt: [SystemNotificationsDLQ, Arn]
          maxReceiveCount: 3

    SystemNotificationsQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - Ref: SystemNotificationsQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: sqs:SendMessage
              Resource: 
                Fn::GetAtt: [SystemNotificationsQueue, Arn]
              Condition:
                ArnEquals:
                  aws:SourceArn: 
                    Ref: SystemNotificationsTopic

    SystemNotificationsSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: sqs
        TopicArn: 
          Ref: SystemNotificationsTopic
        Endpoint: 
          Fn::GetAtt: [SystemNotificationsQueue, Arn]

    # === OUTBOX DLQ (Dead Letter Queue for failed outbox messages) ===
    OutboxDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-outbox-dlq
        MessageRetentionPeriod: 1209600  # 14 días
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy
          - Key: Purpose
            Value: OutboxDeadLetterQueue

    # === COGNITO ===
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${sls:stage}-pool
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
            RequireUppercase: true
        UserPoolTags:
          Environment: ${sls:stage}
          Project: Incodefy

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${sls:stage}-app
        GenerateSecret: false
        UserPoolId: 
          Ref: CognitoUserPool
        PreventUserExistenceErrors: ENABLED
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        AccessTokenValidity: 30
        IdTokenValidity: 30
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: minutes
          IdToken: minutes
          RefreshToken: days
    
    # === SNS ===
    PersonalizationTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-personalization
        DisplayName: "Eventos de personalización de usuarios"

    SystemNotificationsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-notifications
        DisplayName: "Notificaciones del sistema"

    # === CQRS/EVENT SOURCING ===
    EventBusTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-event-bus
        DisplayName: "Event Bus para CQRS/Event Sourcing"

    EventBusSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        Protocol: lambda
        TopicArn: { Ref: EventBusTopic }
        Endpoint: 
          Fn::GetAtt: [EventProjectionLambdaFunction, Arn]

    EventProjectionLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: { Ref: EventProjectionLambdaFunction }
        Action: lambda:InvokeFunction
        Principal: sns.amazonaws.com
        SourceArn: { Ref: EventBusTopic }

    EventsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-events
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: EventTypeIndex
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: AggregateTypeIndex
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        StreamSpecification:
          StreamViewType: NEW_IMAGE
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy
          - Key: Purpose
            Value: EventStore

    SnapshotsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-snapshots
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy
          - Key: Purpose
            Value: SnapshotStore

    # === TRANSACTIONAL OUTBOX TABLE ===
    OutboxTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-outbox
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        GlobalSecondaryIndexes:
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy
          - Key: Purpose
            Value: TransactionalOutbox

    # === OPERATIONS TABLE (Async Request-Reply Pattern) ===
    OperationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-operations
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        Tags:
          - Key: Environment
            Value: ${sls:stage}
          - Key: Project
            Value: Incodefy
          - Key: Purpose
            Value: AsyncRequestReplyTracking

    # === CLOUDWATCH ALARMS FOR CANARY DEPLOYMENTS ===
    
    # Login Function Alarms
    LoginErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-login-errors
        AlarmDescription: "Triggers when login function error rate exceeds threshold"
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 2
        Threshold: 5
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: FunctionName
            Value: { Ref: LoginLambdaFunction }
        TreatMissingData: notBreaching

    LoginLatencyAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-login-latency
        AlarmDescription: "Triggers when login function latency exceeds 5 seconds"
        MetricName: Duration
        Namespace: AWS/Lambda
        Statistic: Average
        Period: 60
        EvaluationPeriods: 2
        Threshold: 5000
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: FunctionName
            Value: { Ref: LoginLambdaFunction }
        TreatMissingData: notBreaching

    # Refresh Function Alarms
    RefreshErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-refresh-errors
        AlarmDescription: "Triggers when refresh function error rate exceeds threshold"
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 2
        Threshold: 3
        ComparisonOperator: GreaterThanThreshold
        Dimensions:
          - Name: FunctionName
            Value: { Ref: RefreshLambdaFunction }
        TreatMissingData: notBreaching

  Outputs:
    # === COGNITO ===
    UserPoolId:
      Value: { Ref: CognitoUserPool }
      Export:
        Name: ${self:service}-${sls:stage}-UserPoolId
      Description: "Cognito User Pool ID"
    
    UserPoolClientId:
      Value: { Ref: CognitoUserPoolClient }
      Export:
        Name: ${self:service}-${sls:stage}-UserPoolClientId
      Description: "Cognito User Pool Client ID"
    
    # === SNS TOPICS ===
    EventBusTopicArn:
      Value: { Ref: EventBusTopic }
      Export:
        Name: ${self:service}-${sls:stage}-EventBusTopicArn
      Description: "Event Bus Topic ARN for CQRS"
    
    PersonalizationTopicArn:
      Value: { Ref: PersonalizationTopic }
      Export:
        Name: ${self:service}-${sls:stage}-PersonalizationTopicArn
      Description: "Personalization Topic ARN"
    
    SystemNotificationsTopicArn:
      Value: { Ref: SystemNotificationsTopic }
      Export:
        Name: ${self:service}-${sls:stage}-SystemNotificationsTopicArn
      Description: "System Notifications Topic ARN"
    
    # === DYNAMODB TABLES ===
    EventsTableName:
      Value: { Ref: EventsTable }
      Export:
        Name: ${self:service}-${sls:stage}-EventsTableName
      Description: "Event Store Table Name"
    
    SnapshotsTableName:
      Value: { Ref: SnapshotsTable }
      Export:
        Name: ${self:service}-${sls:stage}-SnapshotsTableName
      Description: "Snapshots Table Name"
    
    GroupsTableName:
      Value: { Ref: GroupsTable }
      Export:
        Name: ${self:service}-${sls:stage}-GroupsTableName
      Description: "Groups Table Name"
    
    GroupMembersTableName:
      Value: { Ref: GroupMembersTable }
      Export:
        Name: ${self:service}-${sls:stage}-GroupMembersTableName
      Description: "Group Members Table Name"
    
    SpacesTableName:
      Value: { Ref: SpacesTable }
      Export:
        Name: ${self:service}-${sls:stage}-SpacesTableName
      Description: "Spaces Table Name"
    
    OccupantsTableName:
      Value: { Ref: OccupantsTable }
      Export:
        Name: ${self:service}-${sls:stage}-OccupantsTableName
      Description: "Occupants Table Name"
    
    AppointmentsTableName:
      Value: { Ref: AppointmentsTable }
      Export:
        Name: ${self:service}-${sls:stage}-AppointmentsTableName
      Description: "Appointments Table Name"
    
    NotificationsTableName:
      Value: { Ref: NotificationsTable }
      Export:
        Name: ${self:service}-${sls:stage}-NotificationsTableName
      Description: "Notifications Table Name"
    
    OperationsTableName:
      Value: { Ref: OperationsTable }
      Export:
        Name: ${self:service}-${sls:stage}-OperationsTableName
      Description: "Operations Table Name (Async Request-Reply)"
    
    OutboxTableName:
      Value: { Ref: OutboxTable }
      Export:
        Name: ${self:service}-${sls:stage}-OutboxTableName
      Description: "Outbox Table Name (Transactional Outbox Pattern)"
    
    # === SQS QUEUES ===
    PersonalizationQueueUrl:
      Value: { Ref: PersonalizationQueue }
      Export:
        Name: ${self:service}-${sls:stage}-PersonalizationQueueUrl
      Description: "Personalization Queue URL"
    
    PersonalizationQueueArn:
      Value: { Fn::GetAtt: [PersonalizationQueue, Arn] }
      Export:
        Name: ${self:service}-${sls:stage}-PersonalizationQueueArn
      Description: "Personalization Queue ARN"
    
    SystemNotificationsQueueUrl:
      Value: { Ref: SystemNotificationsQueue }
      Export:
        Name: ${self:service}-${sls:stage}-SystemNotificationsQueueUrl
      Description: "System Notifications Queue URL"
    
    # === WEBSOCKET ===
    WebSocketEndpoint:
      Value:
        Fn::Sub: 'wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'
      Export:
        Name: ${self:service}-${sls:stage}-WebSocketEndpoint
      Description: "WebSocket API Endpoint"
    
    ConnectionsTableName:
      Value: { Ref: ConnectionsTable }
      Export:
        Name: ${self:service}-${sls:stage}-ConnectionsTableName
      Description: "WebSocket Connections Table Name"
    
    # === HTTP API ===
    HttpApiUrl:
      Value:
        Fn::Sub: 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
      Export:
        Name: ${self:service}-${sls:stage}-HttpApiUrl
      Description: "HTTP API Gateway URL"
    
    HttpApiId:
      Value: { Ref: HttpApi }
      Export:
        Name: ${self:service}-${sls:stage}-HttpApiId
      Description: "HTTP API Gateway ID"
    
    # === STAGE INFO ===
    ServiceName:
      Value: ${self:service}
      Export:
        Name: ${self:service}-${sls:stage}-ServiceName
      Description: "Service Name"
    
    Stage:
      Value: ${sls:stage}
      Export:
        Name: ${self:service}-${sls:stage}-Stage
      Description: "Deployment Stage"
    
    Region:
      Value: ${self:provider.region}
      Export:
        Name: ${self:service}-${sls:stage}-Region
      Description: "AWS Region"

