service: incodefy
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-2'}
  stage: ${opt:stage, 'dev'}
  
  tags:
    Project: HospitalPadreHurtado
    Environment: ${sls:stage}
    ManagedBy: Serverless
    Version: 1.0.0
  
  environment:
    USER_POOL_ID: { Ref: CognitoUserPool }
    USER_POOL_CLIENT_ID: { Ref: CognitoUserPoolClient }
    USER_ROLES_TABLE: ${self:service}-${sls:stage}-user-roles
    PERMISSIONS_TABLE: ${self:service}-${sls:stage}-permissions
    PARAMETERS_TABLE: ${self:service}-${sls:stage}-parameters
    ACTIVITY_LOGS_TABLE: ${self:service}-${sls:stage}-activity-logs
    PERSONALIZATION_TOPIC_ARN: { Ref: PersonalizationTopic }
    SYSTEM_NOTIFICATIONS_TOPIC_ARN: { Ref: SystemNotificationsTopic }
    PROCESSED_MESSAGES_TABLE: ${self:service}-${sls:stage}-processed-messages
    SERVICE_NAME: ${self:service}
    DB_CATALOGO: ${self:service}-${sls:stage}-catalogo
    DB_AGENDA: ${self:service}-${sls:stage}-agenda
    DB_BOX_INSTRUMENTO: ${self:service}-${sls:stage}-box-instrumento
    DB_NOTIFICACION: ${self:service}-${sls:stage}-notificacion
    STAGE: ${sls:stage}
    GROUPS_TABLE: ${self:service}-${sls:stage}-groups
    GROUP_MEMBERS_TABLE: ${self:service}-${sls:stage}-group-members
    GROUP_INVITATIONS_TABLE: ${self:service}-${sls:stage}-group-invitations
    ROLE_MAPPINGS_TABLE: ${self:service}-${sls:stage}-role-mappings
    PERMISSIONS_CATALOG_TABLE: ${self:service}-${sls:stage}-permissions-catalog
    SPACES_TABLE: ${self:service}-${sls:stage}-spaces
    OCCUPANTS_TABLE: ${self:service}-${sls:stage}-occupants
    ESPECIALIDADES_TABLE: ${self:service}-${sls:stage}-especialidades
    TIPOS_INSTRUMENTOS_TABLE: ${self:service}-${sls:stage}-tipos-instrumentos
    INSTRUMENTOS_TABLE: ${self:service}-${sls:stage}-instrumentos
    ESPACIO_INSTRUMENTO_TABLE: ${self:service}-${sls:stage}-espacio-instrumento
    # SES Configuration
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, 'incodefy2025@gmail.com'}
    APP_URL: ${env:APP_URL, 'http://localhost:3000'}
    
  logs:
    httpApi: true
    
  httpApi:
    cors:
      allowedOrigins:
        # IMPORTANTE: Reemplazar con los dominios reales en producción
        - 'http://localhost:3000'
        - 'https://tu-dominio-produccion.com'
      allowedHeaders:
        - Content-Type
        - Authorization
        - x-bootstrap-email
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 3600
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Sub:
            - https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}
            - UserPoolId: 
                Ref: CognitoUserPool
        audience:
          - Ref: CognitoUserPoolClient
  
  iamRoleStatements:
    - Effect: Allow
      Action:
        - sns:Publish
      Resource:
        - Ref: PersonalizationTopic
        - Ref: SystemNotificationsTopic
    
    # === SES EMAIL PERMISSIONS ===
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: '*'
    
    # === COGNITO USER POOL ACCESS ===
    - Effect: Allow
      Action:
        - cognito-idp:ListUsers
        - cognito-idp:AdminGetUser
      Resource:
        - Fn::GetAtt: [CognitoUserPool, Arn]
    
    # === ACTIVITY LOGS TABLE ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - Fn::GetAtt: [ActivityLogsTable, Arn]
        - Fn::Sub: '${ActivityLogsTable.Arn}/index/*'
    
    # === PARAMETERS TABLE ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - Fn::GetAtt: [ParametersTable, Arn]
    
    # === USER ROLES TABLE - PERMISOS COMPLETOS ===
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
      Resource:
        - Fn::GetAtt: [UserRolesTable, Arn]
        - Fn::Sub: '${UserRolesTable.Arn}/index/*'
    
    # === PERMISSIONS TABLE - SOLO LECTURA ===
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:Query
        - dynamodb:Scan
      Resource:
        - Fn::GetAtt: [PermissionsTable, Arn]

    # === SQS PERMISSIONS ===
    - Effect: Allow
      Action:
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
        - sqs:ChangeMessageVisibility
      Resource:
        - Fn::GetAtt: [PersonalizationQueue, Arn]
        - Fn::GetAtt: [SystemNotificationsQueue, Arn]

    # === PROCESSED MESSAGES TABLE - IDEMPOTENCIA ===
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:UpdateItem
      Resource:
        - Fn::GetAtt: [ProcessedMessagesTable, Arn]
    
    # Lambda InvokeFunction - Solo para funciones específicas de DB
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerPasillos'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerBoxes'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerAgendaPorFecha'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerEspecialidades'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerMedicos'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerAgendaPorBox'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerAgendaPorMedico'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerAgendaPorId'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-verificarConflictoBox'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-verificarConflictoMedico'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerEstadoNoAtendido'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-insertarAgenda'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-actualizarEstadoAgenda'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerInstrumentosPorBox'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerBoxYPasillo'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerAgendaPorBoxYFecha'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerNotificaciones'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerMedicoNombre'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerBoxNombre'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerTotalConsultas'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerBoxesDisponibles'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerEspecialidadMasDemandada'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerConsultasPorEspecialidad'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerConsultasPorDia'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerRendimientoMedicos'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerMedicosPorEspecialidades'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-obtenerConsultasEnCurso'
        - Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-eliminarAgenda'
    
    # === TABLAS DE DATOS: CATALOGO, AGENDA, BOX-INSTRUMENTO, NOTIFICACION ===
    - Effect: Allow
      Action:
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:BatchGetItem
        - dynamodb:BatchWriteItem
      Resource:
        - Fn::GetAtt: [CatalogoTable, Arn]
        - Fn::Sub: '${CatalogoTable.Arn}/index/*'
        - Fn::GetAtt: [AgendaTable, Arn]
        - Fn::Sub: '${AgendaTable.Arn}/index/*'
        - Fn::GetAtt: [BoxInstrumentoTable, Arn]
        - Fn::Sub: '${BoxInstrumentoTable.Arn}/index/*'
        - Fn::GetAtt: [NotificacionTable, Arn]
        - Fn::Sub: '${NotificacionTable.Arn}/index/*'
    
    # Grupos
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:DeleteItem
        - dynamodb:UpdateItem
        - dynamodb:Query
      Resource:
        - Fn::GetAtt: [GroupsTable, Arn]
        - Fn::GetAtt: [GroupMembersTable, Arn]
        - Fn::GetAtt: [GroupInvitationsTable, Arn]
        - Fn::GetAtt: [RoleMappingsTable, Arn]
    
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-group-members
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-group-members/index/UserGroupsIndex
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-groups

    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - dynamodb:BatchWriteItem
        - dynamodb:Query
        - dynamodb:GetItem
      Resource:
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-spaces
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-spaces/index/TypeIndex
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-groups
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-occupants
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-occupants/index/TypeIndex
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-especialidades
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-tipos-instrumentos
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-instrumentos
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-espacio-instrumento
        - arn:aws:dynamodb:${self:provider.region}:${aws:accountId}:table/${self:service}-${sls:stage}-espacio-instrumento/index/*

functions:
  # === HEALTH CHECK ===
  health:
    handler: src/handlers/health.check
    events:
      - httpApi:
          method: GET
          path: /health
    timeout: 10
    description: Health check endpoint for monitoring

  chaosTest:
    handler: src/handlers/chaos.run
    events:
      - httpApi:
          method: GET
          path: /chaos-test
    timeout: 10
    description: Chaos engineering endpoint to simulate failures

  simulateLatency:
    handler: src/handlers/chaos/latencyChaos.simulate
    events:
      - httpApi:
          method: GET
          path: /chaos-latency
    description: Simula una respuesta con retardo aleatorio

  # === FUNCIONES DE AUTENTICACIÓN ===
  login:
    handler: src/handlers/login/login.login
    events:
      - httpApi:
          method: POST
          path: /auth/login
    timeout: 30
    description: User authentication endpoint

  refresh:
    handler: src/handlers/login/refresh.refresh
    events:
      - httpApi:
          method: POST
          path: /auth/refresh
    timeout: 30
    description: Token refresh endpoint

  me:
    handler: src/handlers/login/me.me
    events:
      - httpApi:
          method: GET
          path: /me
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Get current user information

  # === FUNCIONES DE PERMISOS ===
  getMyPermissions:
    handler: src/handlers/permissions/permissions.getMyPermissions
    events:
      - httpApi:
          method: GET
          path: /my-permissions
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Get user permissions

  checkPermission:
    handler: src/handlers/permissions/permissions.checkPermission
    events:
      - httpApi:
          method: POST
          path: /check-permission
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Check specific permission

  assignRole:
    handler: src/handlers/permissions/permissions.assignRole
    events:
      - httpApi:
          method: POST
          path: /admin/assign-role
          authorizer:
            name: cognitoJwt
    timeout: 15
    description: Assign role to user (admin only)
  
  # Bootstrap endpoint sin authorizer para crear el primer admin
  assignRoleBootstrap:
    handler: src/handlers/permissions/permissions.assignRole
    events:
      - httpApi:
          method: POST
          path: /bootstrap/assign-role
    timeout: 15
    description: Bootstrap endpoint to create first admin (no auth required)
    
  removeRole:
    handler: src/handlers/permissions/permissions.removeRole
    events:
      - httpApi:
          method: DELETE
          path: /admin/remove-role
          authorizer:
            name: cognitoJwt

  listAvailablePermissions:
    handler: src/handlers/permissions/permissions.listAvailablePermissions
    events:
      - httpApi:
          method: GET
          path: /admin/available-permissions
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: List all available permissions

  listUsersWithRoles:
    handler: src/handlers/permissions/permissions.listUsersWithRoles
    events:
      - httpApi:
          method: GET
          path: /admin/users-with-roles
          authorizer:
            name: cognitoJwt

  # === FUNCIONES DE PERSONALIZACIÓN ===
  getPersonalization:
    handler: src/handlers/personalization/personalization.getPersonalization
    events:
      - httpApi:
          method: GET
          path: /personalization
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Get user personalization settings

  setPersonalization:
    handler: src/handlers/personalization/personalization.setPersonalization
    events:
      - httpApi:
          method: POST
          path: /personalization
          authorizer:
            name: cognitoJwt
  
  # === FUNCIONES DE COMUNICACIÓN DESACOPLADA ===
  handlePersonalizationEvents:
    handler: src/handlers/events.handlePersonalizationEvents
    events:
      - sqs:
          arn:
            Fn::GetAtt: [PersonalizationQueue, Arn]
          batchSize: 5
          maximumBatchingWindow: 10

  handleSystemNotifications:
    handler: src/handlers/events.handleSystemNotifications
    events:
      - sqs:
          arn:
            Fn::GetAtt: [SystemNotificationsQueue, Arn]
          batchSize: 5
          maximumBatchingWindow: 10

  # === FUNCIONES DE LOGS ===
  getActivityLogs:
    handler: src/handlers/logs.getActivityLogs
    events:
      - httpApi:
          method: GET
          path: /admin/activity-logs
          authorizer:
            name: cognitoJwt

  getActivityStats:
    handler: src/handlers/logs.getActivityStats
    events:
      - httpApi:
          method: GET
          path: /admin/activity-stats
          authorizer:
            name: cognitoJwt

  # === FUNCIONES DE CONFIGURACIÓN DE ESPACIOS ===
  obtenerConfiguracionEspacios:
    handler: src/handlers/espacios/configuracion.obtenerConfiguracion
    events:
      - httpApi:
          method: GET
          path: /api/espacios/configuracion
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Obtiene la configuración de nomenclatura de espacios

  listarEspacios:
    handler: src/handlers/espacios/configuracion.listarEspacios
    events:
      - httpApi:
          method: GET
          path: /api/espacios/lista
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Lista todos los espacios de un grupo

  asignarGrupoActivo:
    handler: src/handlers/espacios/configuracion.asignarGrupoActivo
    events:
      - httpApi:
          method: PUT
          path: /api/espacios/asignar-grupo
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Asigna un grupo de espacios como activo

  obtenerGrupoActivo:
    handler: src/handlers/espacios/configuracion.obtenerGrupoActivo
    events:
      - httpApi:
          method: GET
          path: /api/espacios/grupo-activo
          authorizer:
            name: cognitoJwt
    timeout: 10
    description: Obtiene el grupo de espacios activo del usuario

  eliminarConfiguracionEspacios:
    handler: src/handlers/espacios/configuracion.eliminarConfiguracion
    events:
      - httpApi:
          method: DELETE
          path: /api/espacios/configuracion
          authorizer:
            name: cognitoJwt
    timeout: 30
    description: Elimina una configuración completa de espacios
  
  # === FUNCIONES DB ===
  dbProxy:
    handler: src/handlers/dbProxy.handler
    events:
      - httpApi:
          path: /db/{proxy+}
          method: any
          authorizer:
            name: cognitoJwt
  
  # === ESPACIOS (reemplazo de pasillos/boxes) ===
  obtenerEspaciosGenerales:
    handler: src/handlers/db/obtenerEspaciosGenerales.handler
    description: Obtiene espacios generales (SPACE) de un grupo

  obtenerEspaciosEspecificos:
    handler: src/handlers/db/obtenerEspaciosEspecificos.handler
    description: Obtiene espacios específicos (SUBSPACE) de un grupo
  
  # === OCUPANTES (reemplazo de médicos) ===
  obtenerOcupantes:
    handler: src/handlers/db/obtenerOcupantes.handler
    description: Obtiene ocupantes (OCCUPANT) de un grupo

  # === FUNCIONES LEGACY (mantener para compatibilidad) ===
  obtenerPasillos:
    handler: src/handlers/db/obtenerPasillos.handler

  obtenerBoxes:
    handler: src/handlers/db/obtenerBoxes.handler

  obtenerMedicos:
    handler: src/handlers/db/obtenerMedicos.handler

  obtenerAgendaPorFecha:
    handler: src/handlers/db/obtenerAgendaPorFecha.handler

  obtenerEspecialidades:
    handler: src/handlers/db/obtenerEspecialidades.handler

  obtenerAgendaPorBox:
    handler: src/handlers/db/obtenerAgendaPorBox.handler
  
  obtenerAgendaPorMedico:
    handler: src/handlers/db/obtenerAgendaPorMedico.handler
  
  obtenerAgendaPorId:
    handler: src/handlers/db/obtenerAgendaPorId.handler

  verificarConflictoBox:
    handler: src/handlers/db/verificarConflictoBox.handler
  
  verificarConflictoMedico:
    handler: src/handlers/db/verificarConflictoMedico.handler
    
  obtenerEstadoNoAtendido:
    handler: src/handlers/db/obtenerEstadoNoAtendido.handler
  
  insertarAgenda:
    handler: src/handlers/db/insertarAgenda.handler

  actualizarEstadoAgenda:
    handler: src/handlers/db/actualizarEstadoAgenda.handler

  obtenerInstrumentosPorBox:
    handler: src/handlers/db/obtenerInstrumentosPorBox.handler

  obtenerBoxYPasillo:
    handler: src/handlers/db/obtenerBoxYPasillo.handler
  
  obtenerAgendaPorBoxYFecha:
    handler: src/handlers/db/obtenerAgendaPorBoxYFecha.handler

  obtenerNotificaciones:
    handler: src/handlers/db/obtenerNotificaciones.handler

  obtenerMedicoNombre:
    handler: src/handlers/db/obtenerMedicoNombre.handler

  obtenerTotalConsultas:
    handler: src/handlers/db/obtenerTotalConsultas.handler
  
  obtenerBoxesDisponibles:
    handler: src/handlers/db/obtenerBoxesDisponibles.handler
  
  obtenerEspecialidadMasDemandada:
    handler: src/handlers/db/obtenerEspecialidadMasDemandada.handler

  obtenerConsultasPorEspecialidad:
    handler: src/handlers/db/obtenerConsultasPorEspecialidad.handler
  
  obtenerConsultasPorDia:
    handler: src/handlers/db/obtenerConsultasPorDia.handler
  
  obtenerRendimientoMedicos:
    handler: src/handlers/db/obtenerRendimientoMedicos.handler

  obtenerMedicosPorEspecialidades:
    handler: src/handlers/db/obtenerMedicosPorEspecialidades.handler
  
  obtenerConsultasEnCurso:
    handler: src/handlers/db/obtenerConsultasEnCurso.handler
  
  eliminarAgenda:
    handler: src/handlers/db/eliminarAgenda.handler

  # === Funciones de Grupos ===
  createGroup:
    handler: src/handlers/groups/createGroup.handler
    description: Crea un nuevo grupo
    timeout: 10
    events:
      - httpApi:
          method: POST
          path: /groups
          authorizer: cognitoJwt

  updateNomenclatura:
    handler: src/handlers/groups/updateNomenclatura.handler
    description: Actualiza la nomenclatura de un grupo
    timeout: 10
    events:
      - httpApi:
          method: PUT
          path: /grupos/{groupId}/nomenclatura
          authorizer: cognitoJwt

  listUserGroups:
    handler: src/handlers/groups/listUserGroups.handler
    description: Lista los grupos donde pertenece el usuario
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /groups
          authorizer: cognitoJwt
  
  saveSpaces:
    handler: src/handlers/groups/saveSpaces.handler
    events:
      - httpApi:
          path: /groups/{groupId}/spaces
          method: POST
          authorizer: cognitoJwt
          
  getGroup:
    handler: src/handlers/groups/getGroup.handler
    events:
      - httpApi:
          method: GET
          path: /grupos/{group_id}
          authorizer: cognitoJwt



  inviteToGroup:
    handler: src/handlers/groups/inviteToGroup.handler
    description: Envía invitación a un usuario
    timeout: 15
    events:
