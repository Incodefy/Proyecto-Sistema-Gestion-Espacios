# CloudTrail Configuration for Auditing
# Rastrea todas las acciones en AWS para compliance y seguridad

Resources:
  # S3 Bucket para almacenar logs de CloudTrail
  AuditLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:service}-${sls:stage}-cloudtrail-logs-${aws:accountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90  # Mantener logs por 90 días
            NoncurrentVersionExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: ${sls:stage}
        - Key: Project
          Value: Incodefy
        - Key: Purpose
          Value: AuditLogs

  # Bucket Policy para permitir CloudTrail escribir
  AuditLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditLogsBucket.Arn
          
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AuditLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control

  # CloudTrail Trail
  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - AuditLogsBucketPolicy
    Properties:
      TrailName: ${self:service}-${sls:stage}-audit
      S3BucketName: !Ref AuditLogsBucket
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true  # Integridad de logs
      
      # Event selectors - qué eventos rastrear
      EventSelectors:
        # Management events (API calls)
        - ReadWriteType: All
          IncludeManagementEvents: true
          
          # Data events - DynamoDB
          DataResources:
            - Type: AWS::DynamoDB::Table
              Values:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-*'
        
        # Data events - Lambda
        - ReadWriteType: All
          IncludeManagementEvents: false
          DataResources:
            - Type: AWS::Lambda::Function
              Values:
                - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-*'

      # Insights events - detecta actividad inusual
      InsightSelectors:
        - InsightType: ApiCallRateInsight
      
      Tags:
        - Key: Environment
          Value: ${sls:stage}
        - Key: Project
          Value: Incodefy

  # CloudWatch Log Group para CloudTrail (opcional, para búsquedas más rápidas)
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/cloudtrail/${self:service}-${sls:stage}
      RetentionInDays: 90

  # Role para CloudTrail enviar logs a CloudWatch
  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CloudTrailLogGroup.Arn

  # Metric Filters y Alarms para eventos críticos
  UnauthorizedAPICallsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: '{ ($.errorCode = "*UnauthorizedOperation") || ($.errorCode = "AccessDenied*") }'
      LogGroupName: !Ref CloudTrailLogGroup
      MetricTransformations:
        - MetricName: UnauthorizedAPICalls
          MetricNamespace: ${self:service}/${sls:stage}/Security
          MetricValue: '1'

  ConsoleSignInFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: '{ ($.eventName = ConsoleLogin) && ($.errorMessage = "Failed authentication") }'
      LogGroupName: !Ref CloudTrailLogGroup
      MetricTransformations:
        - MetricName: ConsoleSignInFailures
          MetricNamespace: ${self:service}/${sls:stage}/Security
          MetricValue: '1'

  RootAccountUsageMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: '{ $.userIdentity.type = "Root" && $.userIdentity.invokedBy NOT EXISTS && $.eventType != "AwsServiceEvent" }'
      LogGroupName: !Ref CloudTrailLogGroup
      MetricTransformations:
        - MetricName: RootAccountUsage
          MetricNamespace: ${self:service}/${sls:stage}/Security
          MetricValue: '1'

  IAMPolicyChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: '{($.eventName=DeleteGroupPolicy)||($.eventName=DeleteRolePolicy)||($.eventName=DeleteUserPolicy)||($.eventName=PutGroupPolicy)||($.eventName=PutRolePolicy)||($.eventName=PutUserPolicy)||($.eventName=CreatePolicy)||($.eventName=DeletePolicy)||($.eventName=CreatePolicyVersion)||($.eventName=DeletePolicyVersion)||($.eventName=AttachRolePolicy)||($.eventName=DetachRolePolicy)||($.eventName=AttachUserPolicy)||($.eventName=DetachUserPolicy)||($.eventName=AttachGroupPolicy)||($.eventName=DetachGroupPolicy)}'
      LogGroupName: !Ref CloudTrailLogGroup
      MetricTransformations:
        - MetricName: IAMPolicyChanges
          MetricNamespace: ${self:service}/${sls:stage}/Security
          MetricValue: '1'

Outputs:
  AuditTrailArn:
    Description: CloudTrail ARN
    Value: !GetAtt AuditTrail.Arn
    Export:
      Name: ${self:service}-${sls:stage}-cloudtrail-arn

  AuditLogsBucketName:
    Description: S3 Bucket for audit logs
    Value: !Ref AuditLogsBucket
    Export:
      Name: ${self:service}-${sls:stage}-audit-bucket

  CloudTrailLogGroupName:
    Description: CloudWatch Log Group for CloudTrail
    Value: !Ref CloudTrailLogGroup
    Export:
      Name: ${self:service}-${sls:stage}-cloudtrail-log-group
