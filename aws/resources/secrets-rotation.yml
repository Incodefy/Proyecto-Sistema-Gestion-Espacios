# AWS Secrets Manager con Rotación Automática

resources:
  Resources:
    # Secret principal de la aplicación
    AppSecrets:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: hospital/${self:provider.stage}/app-secrets
        Description: Application secrets with automatic rotation (30 days)
        SecretString: !Sub |
          {
            "JWT_SECRET": "${AWS::NoValue}",
            "SESSION_SECRET": "${AWS::NoValue}",
            "ENCRYPTION_KEY": "${AWS::NoValue}",
            "SES_FROM_EMAIL": "noreply@hospital.com",
            "SES_REGION": "${AWS::Region}",
            "COGNITO_POOL_ID": "${AWS::NoValue}",
            "COGNITO_CLIENT_ID": "${AWS::NoValue}",
            "ROTATION_VERSION": "0"
          }
        Tags:
          - Key: Environment
            Value: ${self:provider.stage}
          - Key: Project
            Value: Hospital-Management
          - Key: AutoRotation
            Value: enabled

    # Política de rotación: cada 30 días
    AppSecretsRotationSchedule:
      Type: AWS::SecretsManager::RotationSchedule
      DependsOn: 
        - AppSecrets
        - SecretsRotationLambdaPermission
      Properties:
        SecretId: !Ref AppSecrets
        RotationLambdaARN: !GetAtt RotateSecretsLambdaFunction.Arn
        RotationRules:
          AutomaticallyAfterDays: 30
          Duration: 2h
          ScheduleExpression: 'rate(30 days)'

    # Permisos para que Secrets Manager invoque la Lambda
    SecretsRotationLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt RotateSecretsLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: secretsmanager.amazonaws.com
        SourceArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hospital/${self:provider.stage}/app-secrets-*'

    # IAM Policy para la función de rotación
    SecretsRotationPolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: ${self:service}-${self:provider.stage}-secrets-rotation
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            # Permisos para leer/actualizar secrets
            - Effect: Allow
              Action:
                - secretsmanager:DescribeSecret
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
                - secretsmanager:UpdateSecretVersionStage
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:hospital/${self:provider.stage}/app-secrets-*'
            
            # Permisos para generar valores aleatorios
            - Effect: Allow
              Action:
                - secretsmanager:GetRandomPassword
              Resource: '*'
            
            # Permisos para logs
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/rotateSecrets:*'
        
        Roles:
          - !Ref IamRoleLambdaExecution

    # CloudWatch Alarm para monitorear rotaciones fallidas
    SecretRotationFailureAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${self:provider.stage}-secret-rotation-failure
        AlarmDescription: Alert when secret rotation fails
        MetricName: Errors
        Namespace: AWS/Lambda
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        Dimensions:
          - Name: FunctionName
            Value: !Ref RotateSecretsLambdaFunction
        TreatMissingData: notBreaching

    # SNS Topic para notificaciones de rotación
    SecretRotationTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${self:provider.stage}-secret-rotation
        DisplayName: Secret Rotation Notifications
        Subscription:
          - Endpoint: ${env:ADMIN_EMAIL, 'admin@hospital.com'}
            Protocol: email

    # EventBridge Rule para notificar rotaciones exitosas
    SecretRotationSuccessRule:
      Type: AWS::Events::Rule
      Properties:
        Name: ${self:service}-${self:provider.stage}-secret-rotation-success
        Description: Notify on successful secret rotation
        EventPattern:
          source:
            - aws.secretsmanager
          detail-type:
            - AWS API Call via CloudTrail
          detail:
            eventName:
              - RotationSucceeded
            requestParameters:
              secretId:
                - !Ref AppSecrets
        State: ENABLED
        Targets:
          - Arn: !Ref SecretRotationTopic
            Id: NotifySNS

  Outputs:
    AppSecretsArn:
      Description: ARN of the application secrets
      Value: !Ref AppSecrets
      Export:
        Name: ${self:service}-${self:provider.stage}-app-secrets-arn

    SecretRotationFunctionArn:
      Description: ARN of the secret rotation Lambda function
      Value: !GetAtt RotateSecretsLambdaFunction.Arn
      Export:
        Name: ${self:service}-${self:provider.stage}-rotation-lambda-arn

    SecretRotationTopicArn:
      Description: SNS Topic for rotation notifications
      Value: !Ref SecretRotationTopic
      Export:
        Name: ${self:service}-${self:provider.stage}-rotation-topic-arn
